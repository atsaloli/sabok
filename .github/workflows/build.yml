name: Build and Deploy Documentation

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoc fop pandoc

      - name: Build documentation
        run: |
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article index.txt
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article sabok.txt
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article field.txt
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article cert.txt
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article maturing.txt
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article associations.txt
          a2x -v -a toc-placement=manual -a toc2 -a theme=volnitsky -f xhtml --fop -d article ontology.txt
          pandoc -o intro.html intro.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
